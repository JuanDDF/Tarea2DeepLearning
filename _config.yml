title: Pronóstico del precio de Bitcoin con MLP multisalida
author: Anyely Sanjuan Benavides y Juan David Díaz Fernández
copyright: "2026"
execute:
  execute_notebooks: "off"
exclude_patterns: [_build, .venv, "**.ipynb_checkpoints", README.md, data, results, app, tests, src, .github, cache]
repository:
  url: https://github.com/JuanDDF/Tarea2DeepLearning
  branch: main
html:
  use_repository_button: true
bibtex_bibfiles:
  - book/references.bib
sphinx:
  config:
    language: es
    templates_path: ["book/_templates"]
    html_static_path: ["book/_static"]
    html_css_files: ["autores.css"]
    html_sidebars:
      "**": ["navbar-logo.html", "autores.html", "icon-links.html", "search-button-field.html", "sbt-sidebar-nav.html"]
